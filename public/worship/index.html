<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>주일 찬양 예습</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1d1b18;
    --muted: #6b665e;
    --line: #e3dfd6;
    --accent: #2f5d50;
    --accent-text: #ffffff;
    --accent-soft: #e2eee9;
    --warn-bg: #fff4e0;
    --warn-text: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513;
      --card: #201f1c;
      --text: #f2efe8;
      --muted: #a39d92;
      --line: #36342f;
      --accent: #7fc1a8;
      --accent-text: #10201a;
      --accent-soft: #233a31;
      --warn-bg: #3a2c12;
      --warn-text: #ffd590;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  button {
    font: inherit;
    min-height: 52px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 0 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .45; cursor: default; }
  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  /* 시작 화면 */
  #intro { text-align: center; padding-top: 12vh; }
  #intro .date { font-size: 20px; color: var(--muted); margin: 0 0 8px; }
  #intro h1 { font-size: 30px; margin: 0 0 24px; }
  #intro ol {
    text-align: left;
    margin: 0 auto 32px;
    padding: 0 0 0 1.6em;
    font-size: 20px;
    max-width: 22em;
  }
  #intro ol li { margin: 6px 0; }
  #startBtn { width: 100%; min-height: 64px; font-size: 24px; }

  /* 곡 카드 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 16px;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 16px;
  }
  .card h2 { font-size: 26px; line-height: 1.3; margin: 6px 0 14px; }

  .player-box {
    width: 70%;
    max-width: 300px;
    margin: 0 auto 14px;
  }
  .player-wrap {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .player-wrap iframe, .player-wrap #player {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .status { text-align: center; color: var(--muted); font-size: 15px; margin-top: 6px; min-height: 1.5em; }

  .notice {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 0 0 14px;
    font-size: 17px;
  }
  .notice a { color: inherit; font-weight: 700; }

  .sections {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }
  .sections button { flex: 1 1 auto; min-width: 72px; font-size: 18px; }
  .sections button.full { flex-basis: 100%; }
  .sections button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  .now {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .label { font-size: 15px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .now .lines { font-size: 25px; line-height: 1.55; font-weight: 600; }
  .now .lines p, .rest .lines p { margin: 0 0 4px; }
  .rest .item { margin-bottom: 14px; }
  .rest .lines { font-size: 17px; color: var(--muted); }
  /* 전체 듣기: 모든 구간 가사를 같은 크기로 */
  .rest.full .item { padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; }
  .rest.full .lines { font-size: 21px; color: var(--text); }
  .rest.full .item.playing { background: var(--accent-soft); }

  /* 전체 흐름 (flow) */
  .flow {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    white-space: nowrap;
    margin: 0 -16px 12px;
    padding: 8px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  .flow::-webkit-scrollbar { display: none; }
  .flow button { flex: 0 0 auto; min-height: 48px; font-size: 17px; padding: 0 12px; }
  .flow button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }
  .flow .arrow { flex: 0 0 auto; color: var(--muted); font-size: 15px; }

  .home {
    display: block;
    width: 100%;
    margin-top: 10px;
    min-height: 48px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    text-decoration: underline;
  }

  /* 지난 주일 */
  /* 관리용: 곡 목록 */
  #admin h1 { font-size: 24px; margin: 8px 0 14px; }
  #admin h2 { font-size: 20px; margin: 28px 0 10px; }
  #admin .notice ul { margin: 6px 0 0; padding-left: 1.2em; }
  .songs-table { width: 100%; border-collapse: collapse; font-size: 15px; background: var(--card); border-radius: 12px; overflow: hidden; }
  .songs-table th, .songs-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  .songs-table th { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .songs-table td:nth-child(n+2), .songs-table th:nth-child(n+2) { text-align: center; white-space: nowrap; }
  .songs-table td a { color: var(--accent); font-weight: 700; font-size: 16px; }
  .songs-table td.dim { color: var(--muted); }
  .ppt-form { display: grid; gap: 10px; }
  .ppt-form label { display: grid; gap: 4px; font-size: 15px; color: var(--muted); }
  .ppt-form select { font: inherit; font-size: 18px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 0 12px; }
  #pptMsg { font-size: 15px; color: var(--muted); min-height: 1.5em; margin: 0; }

  #archive { margin-top: 32px; }
  #archive h3 { font-size: 20px; margin: 0 0 10px; }
  #archive ul { list-style: none; margin: 0; padding: 0; }
  #archive li { margin-bottom: 8px; }
  #archive a {
    display: block;
    min-height: 52px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
  }
  #archive a .d { font-weight: 700; }
  #archive a .t { display: block; font-size: 15px; color: var(--muted); }
  #archive a.current { border-color: var(--accent); border-width: 2px; }
  #archive a.current .d::after { content: " · 지금 보는 주일"; color: var(--accent); font-size: 15px; }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .controls button { font-size: 19px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-pagefind-ignore="all">
<main>
  <section id="intro">
    <p class="date" id="introDate"></p>
    <h1>주일 찬양 예습</h1>
    <p class="notice" id="introNotice" hidden></p>
    <ol id="introList"></ol>
    <button id="startBtn" class="primary">시작</button>
  </section>

  <section id="card" class="card" hidden>
    <div class="meta"><span id="cardDate"></span><span id="cardCount"></span></div>
    <h2 id="cardTitle"></h2>

    <div class="player-box">
      <div class="player-wrap"><div id="player"></div></div>
      <div class="status" id="status"></div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="sections" id="sections"></div>

    <div class="now" id="nowBox">
      <div class="label" id="nowLabel"></div>
      <div class="lines" id="nowLines"></div>
    </div>
    <div class="flow" id="flow" hidden></div>
    <div class="rest" id="rest"></div>

    <div class="controls">
      <button id="replayBtn">이 구간 다시</button>
      <button id="nextBtn" class="primary">다음 곡</button>
    </div>
    <button id="homeBtn" class="home">처음 화면으로</button>
  </section>

  <section id="archive">
    <h3>지난 주일</h3>
    <ul id="archiveList"></ul>
  </section>

  <!-- 관리용 (?view=songs). 성도용 화면에서는 링크하지 않음 -->
  <section id="admin" hidden>
    <h1>곡 목록</h1>
    <div class="notice" id="adminUnknown" hidden></div>
    <table class="songs-table">
      <thead><tr><th>곡 제목</th><th>부른 횟수</th><th>마지막 주일</th><th>흐름</th></tr></thead>
      <tbody id="songRows"></tbody>
    </table>

    <h2>PPT 내려받기</h2>
    <div class="ppt-form">
      <label>주일 <select id="pptWeek"></select></label>
      <label>한 장에 넣을 줄 수
        <select id="pptLines">
          <option value="1">1줄</option>
          <option value="2" selected>2줄</option>
          <option value="3">3줄</option>
          <option value="4">4줄</option>
        </select>
      </label>
      <button id="pptBtn" class="primary" disabled>PPT 내려받기</button>
      <p id="pptMsg"></p>
    </div>
  </section>
</main>

<script src="/worship/songs.js"></script>
<script src="/worship/weeks.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return String(s || "").replace(/\s+/g, " ").trim(); };

  // ---- 데이터 준비 ----
  // 날짜 늦은 순으로 정렬한 주일 목록
  var weeks = WEEKS.slice().sort(function (a, b) {
    return norm(b.date) < norm(a.date) ? -1 : norm(b.date) > norm(a.date) ? 1 : 0;
  });

  function findSong(title) {
    for (var i = 0; i < SONGS.length; i++) {
      if (norm(SONGS[i].title) === norm(title)) return SONGS[i];
    }
    return { title: title, videoId: "", sections: [], missing: true };
  }

  // 전체 듣기용: 구간을 시작 시각 순으로
  function byStart(song) {
    return song.sections.map(function (s, i) { return i; })
      .sort(function (a, b) { return song.sections[a].start - song.sections[b].start; });
  }

  // flow에서 "끝"을 뺀 항목들, "끝" 시각(없으면 null)
  function flowItems(song) {
    return (song.flow || []).filter(function (f) { return norm(f.name) !== "끝"; });
  }
  function flowEnd(song) {
    var list = song.flow || [];
    var last = list[list.length - 1];
    return last && norm(last.name) === "끝" ? last.start : null;
  }

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(norm(iso));
    if (!m) return iso;
    return m[1] + "년 " + Number(m[2]) + "월 " + Number(m[3]) + "일 주일";
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }

  function youtubeLink(song, sec) {
    return "https://www.youtube.com/watch?v=" + encodeURIComponent(song.videoId) +
      (sec ? "&t=" + Math.floor(sec) + "s" : "");
  }

  function linesHtml(lines) {
    var div = document.createElement("div");
    div.className = "lines";
    (lines || []).forEach(function (t) {
      var p = document.createElement("p");
      p.textContent = t;
      div.appendChild(p);
    });
    return div;
  }

  // ---- 상태 ----
  var week = null;   // 지금 보는 주일
  var songs = [];    // 그 주일의 곡들
  var dateText = "";
  var state = {
    songIdx: 0,
    secIdx: -1,     // 재생 중인 구간 (-1: 없음)
    full: false,    // 전체 듣기 중
    flowIdx: -1,    // 전체 듣기에서 지금 나오는 flow 항목 (-1: 간주 등)
    ended: false,
    failed: false,
  };

  var player = null;
  var playerReady = false;
  var pending = null; // 재생기가 준비되기 전에 요청된 재생
  var apiFailed = false;

  // ---- 주일 고르기 ----
  function pickWeek(date) {
    for (var i = 0; i < weeks.length; i++) {
      if (norm(weeks[i].date) === norm(date)) return weeks[i];
    }
    return null;
  }

  function showWeek(date) {
    var found = date ? pickWeek(date) : null;
    week = found || weeks[0];
    songs = week.songs.map(findSong);
    dateText = formatDate(week.date);

    // 재생 멈추고 시작 화면으로
    pending = null;
    if (playerReady) player.pauseVideo();
    state.songIdx = 0;
    state.secIdx = -1;
    state.full = false;
    state.ended = true;

    $("introDate").textContent = dateText;
    var list = $("introList");
    list.innerHTML = "";
    songs.forEach(function (s) {
      var li = document.createElement("li");
      li.textContent = s.title + (s.missing ? " (곡 정보 없음)" : "");
      list.appendChild(li);
    });
    var n = $("introNotice");
    if (date && !found) {
      n.textContent = date + " 주일 정보가 없어 가장 최근 주일을 보여 드립니다.";
      n.hidden = false;
    } else {
      n.hidden = true;
    }
    $("intro").hidden = false;
    $("card").hidden = true;
    $("archive").hidden = false;
    $("admin").hidden = true;
    $("nextBtn").hidden = false;
    $("homeBtn").textContent = "처음 화면으로";
    renderArchive();
    document.title = "주일 찬양 예습 · " + dateText;
  }

  function weekUrl(w) {
    return location.pathname + "?date=" + encodeURIComponent(norm(w.date));
  }

  function renderArchive() {
    var ul = $("archiveList");
    ul.innerHTML = "";
    weeks.forEach(function (w) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = weekUrl(w);
      if (w === week) a.className = "current";
      var d = document.createElement("span");
      d.className = "d";
      d.textContent = formatDate(w.date);
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = w.songs.join(" · ");
      a.appendChild(d);
      a.appendChild(t);
      a.addEventListener("click", function (e) {
        e.preventDefault();
        history.pushState(null, "", weekUrl(w));
        showWeek(w.date);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      li.appendChild(a);
      ul.appendChild(li);
    });
  }

  window.addEventListener("popstate", function () { route(); });

  // ---- 화면 그리기 ----
  function renderCard() {
    var song = songs[state.songIdx];
    $("cardDate").textContent = dateText;
    $("cardCount").textContent = songs.length + "곡 중 " + (state.songIdx + 1) + "번째";
    $("cardTitle").textContent = song.title;
    $("nextBtn").textContent = state.songIdx < songs.length - 1 ? "다음 곡" : "처음 곡으로";

    var box = $("sections");
    box.innerHTML = "";
    song.sections.forEach(function (s, i) {
      var b = document.createElement("button");
      b.textContent = s.name;
      b.addEventListener("click", function () { playSection(i); });
      box.appendChild(b);
    });
    if (song.sections.length) {
      var all = document.createElement("button");
      all.textContent = "전체 듣기";
      all.className = "full";
      all.addEventListener("click", function () { playFull(0); });
      box.appendChild(all);
    }

    if (song.missing) {
      showNotice("songs.js에서 \"" + song.title + "\" 곡을 찾지 못했습니다. weeks.js의 제목이 songs.js와 똑같은지 확인해 주세요.");
    } else {
      hideNotice();
    }
    renderLyrics();
  }

  function renderLyrics() {
    var song = songs[state.songIdx];
    var n = song.sections.length;

    Array.prototype.forEach.call($("sections").children, function (b, i) {
      b.classList.toggle("active", state.full ? i === n : i === state.secIdx);
    });

    var rest = $("rest");
    rest.innerHTML = "";
    rest.classList.toggle("full", state.full);
    $("nowBox").hidden = state.full;
    renderFlow();

    var addItem = function (i) {
      var s = song.sections[i];
      var item = document.createElement("div");
      item.className = "item";
      item.dataset.idx = i;
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = s.name;
      item.appendChild(label);
      item.appendChild(linesHtml(s.lines));
      rest.appendChild(item);
    };

    if (state.full) {
      byStart(song).forEach(addItem);
      return;
    }

    var cur = state.secIdx >= 0 ? state.secIdx : 0;
    var now = song.sections[cur];
    $("nowLabel").textContent = now ? now.name : "";
    var nl = $("nowLines");
    nl.innerHTML = "";
    (now ? now.lines : []).forEach(function (t) {
      var p = document.createElement("p"); p.textContent = t; nl.appendChild(p);
    });
    song.sections.forEach(function (s, i) { if (i !== cur) addItem(i); });
  }

  // 전체 듣기 중 흐름 한 줄
  function renderFlow() {
    var box = $("flow");
    var song = songs[state.songIdx];
    var items = flowItems(song);
    box.innerHTML = "";
    box.hidden = !(state.full && items.length);
    if (box.hidden) return;
    items.forEach(function (f, i) {
      if (i > 0) {
        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "→";
        box.appendChild(arrow);
      }
      var b = document.createElement("button");
      b.textContent = f.name;
      b.dataset.idx = i;
      b.addEventListener("click", function () { playFull(i); });
      box.appendChild(b);
    });
  }

  // 전체 듣기 중 지금 나오는 구간 가사 강조
  function markPlaying(t) {
    var song = songs[state.songIdx];
    var items = flowItems(song);
    var activeName = null;

    if (items.length) {
      var idx = -1;
      for (var i = 0; i < items.length; i++) {
        if (t >= items[i].start && t < items[i].end) { idx = i; break; }
      }
      state.flowIdx = idx;
      activeName = idx >= 0 ? norm(items[idx].name) : null;
      var activeBtn = null;
      Array.prototype.forEach.call($("flow").querySelectorAll("button"), function (b) {
        var on = Number(b.dataset.idx) === idx;
        b.classList.toggle("active", on);
        if (on) activeBtn = b;
      });
      if (activeBtn) {
        var box = $("flow");
        var left = activeBtn.offsetLeft - (box.clientWidth - activeBtn.offsetWidth) / 2;
        if (Math.abs(box.scrollLeft - left) > 4) box.scrollTo({ left: left, behavior: "smooth" });
      }
    }

    Array.prototype.forEach.call($("rest").children, function (el) {
      var s = song.sections[el.dataset.idx];
      var on = !!s && (items.length ? norm(s.name) === activeName : t >= s.start && t < s.end);
      var was = el.classList.contains("playing");
      el.classList.toggle("playing", on);
      if (on && !was) scrollIntoViewIfNeeded(el);
    });
  }

  // 강조된 가사가 화면 밖이면 보이도록 (위쪽 흐름 줄에 가리지 않게)
  function scrollIntoViewIfNeeded(el) {
    var r = el.getBoundingClientRect();
    var top = $("flow").hidden ? 0 : $("flow").offsetHeight;
    var vh = window.innerHeight;
    if (r.top >= top && r.bottom <= vh) return;
    var y = window.scrollY + r.top - top - 8;
    if (r.height < vh - top) y = window.scrollY + r.top - top - (vh - top - r.height) / 3;
    window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
  }

  function showNotice(text, song, sec) {
    var n = $("notice");
    n.textContent = text + " ";
    if (song && song.videoId) {
      var a = document.createElement("a");
      a.href = youtubeLink(song, sec);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "유튜브에서 열기";
      n.appendChild(a);
    }
    n.hidden = false;
  }
  function hideNotice() { $("notice").hidden = true; }

  function setStatus(text) { $("status").textContent = text; }

  // ---- 재생 ----
  function load(req) {
    if (apiFailed) { showApiFailed(); return; }
    hideNotice();
    if (!playerReady) { pending = req; return; }
    player.loadVideoById(req);
  }

  // 구간 하나를 재생하고 멈춤
  function playSection(idx) {
    var song = songs[state.songIdx];
    var s = song.sections[idx];
    state.secIdx = idx;
    state.full = false;
    state.ended = false;
    state.failed = false;
    renderLyrics();
    if (!s) return;
    setStatus(s.name + " · " + fmt(s.start) + "~" + fmt(s.end));
    load({ videoId: song.videoId, startSeconds: s.start, endSeconds: s.end });
  }

  // 전체 듣기: flow가 있으면 flow 항목(fromIdx, 기본 첫 항목)부터 "끝"까지,
  // 없으면 첫 구간 시작 시각부터 영상 끝까지
  function playFull(fromIdx) {
    var song = songs[state.songIdx];
    if (!song.sections.length) return;
    var items = flowItems(song);
    var start = items.length
      ? items[typeof fromIdx === "number" ? fromIdx : 0].start
      : song.sections[byStart(song)[0]].start;
    var end = flowEnd(song);
    var wasFull = state.full;
    state.secIdx = -1;
    state.full = true;
    state.flowIdx = -1;
    state.ended = false;
    state.failed = false;
    if (!wasFull) renderLyrics();
    markPlaying(start);
    setStatus("전체 듣기 · " + fmt(start) + (end != null ? "~" + fmt(end) : "부터"));
    var req = { videoId: song.videoId, startSeconds: start };
    if (end != null) req.endSeconds = end;
    load(req);
  }

  function startSong(songIdx) {
    state.songIdx = songIdx;
    state.secIdx = -1;
    state.full = false;
    var song = songs[songIdx];
    renderCard();
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (song.missing || !song.sections.length) {
      state.ended = true;
      pending = null;
      if (playerReady) player.stopVideo();
      setStatus("");
      return;
    }
    playSection(0);
  }

  function onSegmentEnd() {
    if (state.ended) return;
    state.ended = true;
    if (playerReady) player.pauseVideo();
    if (state.full) {
      setStatus("전체 듣기 끝");
      return;
    }
    var s = songs[state.songIdx].sections[state.secIdx];
    setStatus(s ? s.name + " 끝" : "");
  }

  $("replayBtn").addEventListener("click", function () {
    if (state.full) playFull(0);
    else if (state.secIdx >= 0) playSection(state.secIdx);
  });

  $("nextBtn").addEventListener("click", function () {
    startSong(state.songIdx + 1 < songs.length ? state.songIdx + 1 : 0);
  });

  $("startBtn").addEventListener("click", function () {
    $("intro").hidden = true;
    $("card").hidden = false;
    $("archive").hidden = true;
    startSong(0);
  });

  $("homeBtn").addEventListener("click", function () {
    if (new URLSearchParams(location.search).get("view") === "songs") {
      history.pushState(null, "", adminUrl());
      showAdmin();
    } else {
      showWeek(week.date);
    }
    window.scrollTo({ top: 0 });
  });

  // 끝 시각 감시 (endSeconds가 안 먹는 경우 대비) + 전체 듣기 가사 강조
  setInterval(function () {
    if (!playerReady || state.ended || state.failed) return;
    if (typeof player.getCurrentTime !== "function") return;
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
    var t = player.getCurrentTime();
    if (state.full) {
      var end = flowEnd(songs[state.songIdx]);
      if (end != null && t >= end - 0.2) { onSegmentEnd(); return; }
      markPlaying(t);
      return;
    }
    var s = songs[state.songIdx].sections[state.secIdx];
    if (s && t >= s.end - 0.2) onSegmentEnd();
  }, 200);

  // ---- 유튜브 IFrame Player API ----
  window.onYouTubeIframeAPIReady = function () {
    var firstSong = null;
    for (var i = 0; i < songs.length; i++) if (songs[i].videoId) { firstSong = songs[i]; break; }
    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      videoId: firstSong ? firstSong.videoId : undefined,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
      events: {
        onReady: function () {
          playerReady = true;
          if (pending) { var p = pending; pending = null; player.loadVideoById(p); }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) onSegmentEnd();
          if (e.data === YT.PlayerState.PLAYING) hideNotice();
        },
        onError: function (e) {
          state.failed = true;
          var song = songs[state.songIdx];
          var s = state.full ? (flowItems(song)[0] || song.sections[byStart(song)[0]]) : song.sections[state.secIdx];
          var why = (e.data === 101 || e.data === 150)
            ? "이 영상은 다른 사이트에서 재생할 수 없도록 막혀 있습니다."
            : "영상을 재생할 수 없습니다.";
          showNotice(why + " 유튜브에서 직접 들어 주세요" + (s ? " (" + (state.full ? "전체 듣기" : s.name) + " " + fmt(s.start) + "부터)." : "."), song, s && s.start);
          setStatus("");
        },
      },
    });
  };

  function showApiFailed() {
    var song = songs[state.songIdx];
    var s = song.sections[state.secIdx >= 0 ? state.secIdx : 0];
    showNotice("유튜브 재생기를 불러오지 못했습니다. 인터넷 연결을 확인하거나 유튜브에서 직접 들어 주세요.", song, s && s.start);
  }

  // ---- 관리용 화면 (?view=songs) ----
  // 성도용 화면에서는 링크하지 않습니다. 곡 목록, 곡 하나 들어 보기, PPT 내려받기.
  var PPTX_SRC = "https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js";
  var pptxState = "idle"; // idle | loading | ready | failed

  function adminUrl(title) {
    return location.pathname + "?view=songs" + (title ? "&song=" + encodeURIComponent(norm(title)) : "");
  }

  // weeks.js로 곡마다 부른 횟수와 마지막 주일 계산
  function songStats() {
    var stats = {};
    SONGS.forEach(function (s) { stats[norm(s.title)] = { song: s, count: 0, last: null }; });
    var unknown = {};
    weeks.forEach(function (w) {
      var seen = {};
      w.songs.forEach(function (title) {
        var key = norm(title);
        if (seen[key]) return;
        seen[key] = true;
        var st = stats[key];
        if (st) {
          st.count++;
          if (!st.last || norm(w.date) > st.last) st.last = norm(w.date);
        } else {
          (unknown[key] = unknown[key] || []).push(norm(w.date));
        }
      });
    });
    return { stats: stats, unknown: unknown };
  }

  function showAdmin(title) {
    pending = null;
    if (playerReady) player.pauseVideo();
    state.secIdx = -1;
    state.full = false;
    state.ended = true;
    $("intro").hidden = true;
    $("archive").hidden = true;
    $("admin").hidden = !!title;
    $("card").hidden = !title;
    loadPptx();
    if (title) openAdminSong(title);
    else renderSongList();
  }

  function renderSongList() {
    document.title = "곡 목록 · 주일 찬양";
    var r = songStats();

    var warn = $("adminUnknown");
    var keys = Object.keys(r.unknown);
    warn.innerHTML = "";
    warn.hidden = !keys.length;
    if (keys.length) {
      var head = document.createElement("strong");
      head.textContent = "weeks.js에는 있는데 songs.js에 없는 제목";
      warn.appendChild(head);
      var ul = document.createElement("ul");
      keys.forEach(function (k) {
        var li = document.createElement("li");
        li.textContent = "“" + k + "” — " + r.unknown[k].join(", ");
        ul.appendChild(li);
      });
      warn.appendChild(ul);
    }

    // 마지막으로 부른 주일이 최근인 순서, 안 부른 곡은 맨 아래(제목순)
    var rows = Object.keys(r.stats).map(function (k) { return r.stats[k]; });
    rows.sort(function (a, b) {
      if (a.last && b.last) return a.last < b.last ? 1 : a.last > b.last ? -1 : 0;
      if (a.last) return -1;
      if (b.last) return 1;
      return a.song.title.localeCompare(b.song.title, "ko");
    });

    var tbody = $("songRows");
    tbody.innerHTML = "";
    rows.forEach(function (row) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      var a = document.createElement("a");
      a.href = adminUrl(row.song.title);
      a.textContent = row.song.title;
      a.addEventListener("click", function (e) {
        e.preventDefault();
        history.pushState(null, "", adminUrl(row.song.title));
        showAdmin(row.song.title);
        window.scrollTo({ top: 0 });
      });
      td.appendChild(a);
      tr.appendChild(td);
      [String(row.count), row.last || "—", flowItems(row.song).length ? "있음" : "없음"].forEach(function (t, i) {
        var c = document.createElement("td");
        c.textContent = t;
        if (i === 2 && t === "없음") c.className = "dim";
        tr.appendChild(c);
      });
      tbody.appendChild(tr);
    });

    var sel = $("pptWeek");
    var prev = sel.value;
    sel.innerHTML = "";
    weeks.forEach(function (w) {
      var o = document.createElement("option");
      o.value = norm(w.date);
      o.textContent = norm(w.date) + " (" + w.songs.length + "곡)";
      sel.appendChild(o);
    });
    if (prev) sel.value = prev;
  }

  function openAdminSong(title) {
    var song = findSong(title);
    var st = songStats().stats[norm(title)];
    songs = [song];
    state.songIdx = 0;
    renderCard();
    $("cardDate").textContent = st && st.last ? "마지막: " + st.last : "아직 안 부른 곡";
    $("cardCount").textContent = st ? st.count + "번 부름" : "";
    $("nextBtn").hidden = true;
    $("homeBtn").textContent = "곡 목록으로";
    setStatus("");
    document.title = song.title + " · 곡 목록";
  }

  // ---- PPT ----
  function loadPptx() {
    if (pptxState !== "idle") return;
    pptxState = "loading";
    updatePptBtn();
    var s = document.createElement("script");
    s.src = PPTX_SRC;
    s.onload = function () { pptxState = window.PptxGenJS ? "ready" : "failed"; updatePptBtn(); };
    s.onerror = function () { pptxState = "failed"; updatePptBtn(); };
    document.head.appendChild(s);
  }

  function updatePptBtn() {
    var b = $("pptBtn");
    b.disabled = pptxState !== "ready";
    if (pptxState === "loading") pptMsg("PPT 도구를 불러오는 중입니다…");
    else if (pptxState === "failed") pptMsg("PPT 도구(PptxGenJS)를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.");
    else pptMsg("");
  }

  function pptMsg(t) { $("pptMsg").textContent = t; }

  function chunk(lines, n) {
    var out = [];
    for (var i = 0; i < lines.length; i += n) out.push(lines.slice(i, i + n));
    return out;
  }

  var FONT = "Malgun Gothic";

  function makePpt() {
    var w = pickWeek($("pptWeek").value);
    if (!w || pptxState !== "ready") return;
    var per = Number($("pptLines").value) || 2;

    var pptx = new PptxGenJS();
    pptx.layout = "LAYOUT_16x9"; // 10 x 5.625 in
    pptx.title = "주일 찬양 " + norm(w.date);

    var missing = [];
    w.songs.forEach(function (title) {
      var song = findSong(title);

      var t = pptx.addSlide();
      t.background = { color: "000000" };
      t.addText(song.title, {
        x: 0.5, y: 0, w: 9, h: 5.625,
        align: "center", valign: "middle",
        fontFace: FONT, fontSize: 48, bold: true, color: "FFFFFF",
      });
      if (song.missing) { missing.push(title); return; }

      song.sections.forEach(function (sec) {
        chunk(sec.lines || [], per).forEach(function (group) {
          var sl = pptx.addSlide();
          sl.background = { color: "000000" };
          sl.addText(group.join("\n"), {
            x: 0.5, y: 0.5, w: 9, h: 4.625,
            align: "center", valign: "middle",
            fontFace: FONT, fontSize: per >= 4 ? 32 : 40, color: "FFFFFF",
            lineSpacingMultiple: 1.2, fit: "shrink",
          });
          sl.addText(sec.name, {
            x: 0.25, y: 0.15, w: 3, h: 0.4,
            align: "left", valign: "top",
            fontFace: FONT, fontSize: 14, color: "9A9A9A",
          });
        });
      });
    });

    pptMsg("만드는 중…");
    pptx.writeFile({ fileName: "worship-" + norm(w.date) + ".pptx" }).then(function () {
      pptMsg(missing.length
        ? "내려받았습니다. songs.js에 없는 곡은 제목 슬라이드만 넣었습니다: " + missing.join(", ")
        : "내려받았습니다.");
    }, function (err) {
      pptMsg("PPT를 만들지 못했습니다: " + (err && err.message ? err.message : err));
    });
  }

  $("pptBtn").addEventListener("click", makePpt);

  // 주소에 따라 성도용/관리용 화면 고르기
  function route() {
    var q = new URLSearchParams(location.search);
    if (q.get("view") === "songs") showAdmin(q.get("song"));
    else showWeek(q.get("date"));
  }

  route();

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () {
    apiFailed = true;
    if (!$("card").hidden) showApiFailed();
  };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
