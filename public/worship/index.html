<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>주일 찬양 예습</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1d1b18;
    --muted: #6b665e;
    --line: #e3dfd6;
    --accent: #2f5d50;
    --accent-text: #ffffff;
    --accent-soft: #e2eee9;
    --warn-bg: #fff4e0;
    --warn-text: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513;
      --card: #201f1c;
      --text: #f2efe8;
      --muted: #a39d92;
      --line: #36342f;
      --accent: #7fc1a8;
      --accent-text: #10201a;
      --accent-soft: #233a31;
      --warn-bg: #3a2c12;
      --warn-text: #ffd590;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
  }
  button {
    font: inherit;
    min-height: 52px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 0 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .45; cursor: default; }
  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  /* 시작 화면 */
  #intro { text-align: center; padding-top: 12vh; }
  #intro .date { font-size: 20px; color: var(--muted); margin: 0 0 8px; }
  #intro h1 { font-size: 30px; margin: 0 0 24px; }
  #intro ol {
    text-align: left;
    margin: 0 auto 32px;
    padding: 0 0 0 1.6em;
    font-size: 20px;
    max-width: 22em;
  }
  #intro ol li { margin: 6px 0; }
  #startBtn { width: 100%; min-height: 64px; font-size: 24px; }

  /* 곡 카드 */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 16px;
  }
  .meta {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 16px;
  }
  .card h2 { font-size: 26px; line-height: 1.3; margin: 6px 0 14px; }

  .player-box {
    width: 70%;
    max-width: 300px;
    margin: 0 auto 14px;
  }
  .player-wrap {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .player-wrap iframe, .player-wrap #player {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  .status { text-align: center; color: var(--muted); font-size: 15px; margin-top: 6px; min-height: 1.5em; }

  .notice {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 0 0 14px;
    font-size: 17px;
  }
  .notice a { color: inherit; font-weight: 700; }

  .sections {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }
  .sections button { flex: 1 1 auto; min-width: 72px; font-size: 18px; }
  .sections button.auto::after { content: " ▸"; color: var(--muted); font-size: 14px; }
  .sections button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }
  .sections button.active::after { color: inherit; }

  .now {
    background: var(--accent-soft);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .label { font-size: 15px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .now .lines { font-size: 25px; line-height: 1.55; font-weight: 600; }
  .now .lines p, .rest .lines p { margin: 0 0 4px; }
  .rest .item { margin-bottom: 14px; }
  .rest .lines { font-size: 17px; color: var(--muted); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  .controls button { font-size: 19px; }
  .hint { color: var(--muted); font-size: 14px; text-align: center; margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body data-pagefind-ignore="all">
<main>
  <section id="intro">
    <p class="date" id="introDate"></p>
    <h1>주일 찬양 예습</h1>
    <ol id="introList"></ol>
    <button id="startBtn" class="primary">시작</button>
  </section>

  <section id="card" class="card" hidden>
    <div class="meta"><span id="cardDate"></span><span id="cardCount"></span></div>
    <h2 id="cardTitle"></h2>

    <div class="player-box">
      <div class="player-wrap"><div id="player"></div></div>
      <div class="status" id="status"></div>
    </div>

    <div class="notice" id="notice" hidden></div>

    <div class="sections" id="sections"></div>

    <div class="now">
      <div class="label" id="nowLabel"></div>
      <div class="lines" id="nowLines"></div>
    </div>
    <div class="rest" id="rest"></div>

    <div class="controls">
      <button id="replayBtn">이 구간 다시</button>
      <button id="nextBtn" class="primary">다음 곡</button>
    </div>
    <p class="hint">▸ 표시는 자동으로 이어 재생되는 구간입니다.</p>
  </section>
</main>

<script src="/worship/songs.js"></script>
<script src="/worship/week.js"></script>
<script>
(function () {
  // 자동재생 순서 (이름 기준). 목록에 없는 이름은 맨 뒤에 원래 순서대로.
  var AUTO_ORDER = ["1절", "후렴 앞", "후렴", "브릿지", "태그"];

  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return String(s || "").replace(/\s+/g, " ").trim(); };

  // ---- 데이터 준비 ----
  var songs = WEEK.songs.map(function (title) {
    var found = null;
    for (var i = 0; i < SONGS.length; i++) {
      if (norm(SONGS[i].title) === norm(title)) { found = SONGS[i]; break; }
    }
    return found ? found : { title: title, videoId: "", sections: [], missing: true };
  });

  function autoQueue(song) {
    var list = [];
    song.sections.forEach(function (s, i) { if (s.auto) list.push(i); });
    var rank = function (i) {
      var r = AUTO_ORDER.indexOf(norm(song.sections[i].name));
      return r === -1 ? AUTO_ORDER.length : r;
    };
    return list.sort(function (a, b) { return rank(a) - rank(b) || a - b; });
  }

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(norm(iso));
    if (!m) return iso;
    return m[1] + "년 " + Number(m[2]) + "월 " + Number(m[3]) + "일 주일";
  }

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  }

  function youtubeLink(song, sec) {
    return "https://www.youtube.com/watch?v=" + encodeURIComponent(song.videoId) +
      (sec ? "&t=" + Math.floor(sec) + "s" : "");
  }

  function linesHtml(lines) {
    var div = document.createElement("div");
    div.className = "lines";
    (lines || []).forEach(function (t) {
      var p = document.createElement("p");
      p.textContent = t;
      div.appendChild(p);
    });
    return div;
  }

  // ---- 상태 ----
  var state = {
    songIdx: 0,
    secIdx: -1,     // 현재 구간
    queue: [],      // 자동재생 구간 순서
    auto: false,    // 이 구간이 끝나면 다음 자동 구간으로 넘어갈지
    playing: false,
    token: 0,       // 구간마다 증가. 끝 처리 중복 방지
    ended: false,
    failed: false,
  };

  var player = null;
  var playerReady = false;
  var pending = null; // 재생기가 준비되기 전에 요청된 재생
  var apiFailed = false;

  // ---- 시작 화면 ----
  var dateText = formatDate(WEEK.date);
  $("introDate").textContent = dateText;
  songs.forEach(function (s) {
    var li = document.createElement("li");
    li.textContent = s.title + (s.missing ? " (곡 정보 없음)" : "");
    $("introList").appendChild(li);
  });

  // ---- 화면 그리기 ----
  function renderCard() {
    var song = songs[state.songIdx];
    $("cardDate").textContent = dateText;
    $("cardCount").textContent = songs.length + "곡 중 " + (state.songIdx + 1) + "번째";
    $("cardTitle").textContent = song.title;
    $("nextBtn").textContent = state.songIdx < songs.length - 1 ? "다음 곡" : "처음 곡으로";

    var box = $("sections");
    box.innerHTML = "";
    song.sections.forEach(function (s, i) {
      var b = document.createElement("button");
      b.textContent = s.name;
      if (s.auto) b.className = "auto";
      b.addEventListener("click", function () { onSectionTap(i); });
      box.appendChild(b);
    });

    if (song.missing) {
      showNotice("songs.js에서 \"" + song.title + "\" 곡을 찾지 못했습니다. week.js의 제목이 songs.js와 똑같은지 확인해 주세요.");
    } else {
      hideNotice();
    }
    renderLyrics();
  }

  function renderLyrics() {
    var song = songs[state.songIdx];
    var cur = state.secIdx >= 0 ? state.secIdx : (state.queue[0] != null ? state.queue[0] : 0);

    Array.prototype.forEach.call($("sections").children, function (b, i) {
      b.classList.toggle("active", i === state.secIdx);
    });

    var now = song.sections[cur];
    $("nowLabel").textContent = now ? now.name : "";
    var nl = $("nowLines");
    nl.innerHTML = "";
    (now ? now.lines : []).forEach(function (t) {
      var p = document.createElement("p"); p.textContent = t; nl.appendChild(p);
    });

    var rest = $("rest");
    rest.innerHTML = "";
    song.sections.forEach(function (s, i) {
      if (i === cur) return;
      var item = document.createElement("div");
      item.className = "item";
      var label = document.createElement("div");
      label.className = "label";
      label.textContent = s.name;
      item.appendChild(label);
      item.appendChild(linesHtml(s.lines));
      rest.appendChild(item);
    });
  }

  function showNotice(text, song, sec) {
    var n = $("notice");
    n.textContent = text + " ";
    if (song && song.videoId) {
      var a = document.createElement("a");
      a.href = youtubeLink(song, sec);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "유튜브에서 열기";
      n.appendChild(a);
    }
    n.hidden = false;
  }
  function hideNotice() { $("notice").hidden = true; }

  function setStatus(text) { $("status").textContent = text; }

  // ---- 재생 ----
  function playSection(idx, auto) {
    var song = songs[state.songIdx];
    var s = song.sections[idx];
    state.secIdx = idx;
    state.auto = auto;
    state.token++;
    state.ended = false;
    state.failed = false;
    renderLyrics();
    if (!s) return;
    if (apiFailed) { showApiFailed(); return; }
    hideNotice();
    setStatus(s.name + " · " + fmt(s.start) + "~" + fmt(s.end));

    var req = { videoId: song.videoId, startSeconds: s.start, endSeconds: s.end };
    if (!playerReady) { pending = req; return; }
    player.loadVideoById(req);
  }

  function startSong(songIdx) {
    state.songIdx = songIdx;
    var song = songs[songIdx];
    state.queue = autoQueue(song);
    state.secIdx = -1;
    renderCard();
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (song.missing || !song.sections.length) {
      if (playerReady) player.stopVideo();
      setStatus("");
      return;
    }
    var first = state.queue.length ? state.queue[0] : 0;
    playSection(first, state.queue.length > 0);
  }

  function onSegmentEnd() {
    if (state.ended) return;
    state.ended = true;
    if (playerReady) player.pauseVideo();

    if (state.auto) {
      var pos = state.queue.indexOf(state.secIdx);
      if (pos !== -1 && pos + 1 < state.queue.length) {
        playSection(state.queue[pos + 1], true);
        return;
      }
      if (state.songIdx + 1 < songs.length) {
        startSong(state.songIdx + 1);
        return;
      }
      setStatus("마지막 곡까지 끝났습니다");
      return;
    }
    setStatus(songs[state.songIdx].sections[state.secIdx].name + " 끝");
  }

  function onSectionTap(i) {
    // 자동재생 구간을 누르면 거기서부터 자동으로 이어 재생, 그 외는 그 구간만 재생
    playSection(i, state.queue.indexOf(i) !== -1);
  }

  $("replayBtn").addEventListener("click", function () {
    if (state.secIdx < 0) return;
    playSection(state.secIdx, state.auto);
  });

  $("nextBtn").addEventListener("click", function () {
    startSong(state.songIdx + 1 < songs.length ? state.songIdx + 1 : 0);
  });

  $("startBtn").addEventListener("click", function () {
    $("intro").hidden = true;
    $("card").hidden = false;
    startSong(0);
  });

  // 끝 시각 감시 (endSeconds가 안 먹는 경우 대비)
  setInterval(function () {
    if (!playerReady || state.secIdx < 0 || state.ended || state.failed) return;
    var s = songs[state.songIdx].sections[state.secIdx];
    if (!s || typeof player.getCurrentTime !== "function") return;
    if (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING &&
        player.getCurrentTime() >= s.end - 0.2) {
      onSegmentEnd();
    }
  }, 200);

  // ---- 유튜브 IFrame Player API ----
  window.onYouTubeIframeAPIReady = function () {
    var firstSong = null;
    for (var i = 0; i < songs.length; i++) if (songs[i].videoId) { firstSong = songs[i]; break; }
    player = new YT.Player("player", {
      width: "100%",
      height: "100%",
      videoId: firstSong ? firstSong.videoId : undefined,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 1 },
      events: {
        onReady: function () {
          playerReady = true;
          if (pending) { var p = pending; pending = null; player.loadVideoById(p); }
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) onSegmentEnd();
          if (e.data === YT.PlayerState.PLAYING) {
            state.playing = true;
            hideNotice();
          }
        },
        onError: function (e) {
          state.failed = true;
          var song = songs[state.songIdx];
          var s = song.sections[state.secIdx];
          var why = (e.data === 101 || e.data === 150)
            ? "이 영상은 다른 사이트에서 재생할 수 없도록 막혀 있습니다."
            : "영상을 재생할 수 없습니다.";
          showNotice(why + " 유튜브에서 직접 들어 주세요" + (s ? " (" + s.name + " " + fmt(s.start) + "부터)." : "."), song, s && s.start);
          setStatus("");
        },
      },
    });
  };

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  function showApiFailed() {
    var song = songs[state.songIdx];
    var s = song.sections[state.secIdx];
    showNotice("유튜브 재생기를 불러오지 못했습니다. 인터넷 연결을 확인하거나 유튜브에서 직접 들어 주세요.", song, s && s.start);
  }
  tag.onerror = function () {
    apiFailed = true;
    showApiFailed();
  };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
